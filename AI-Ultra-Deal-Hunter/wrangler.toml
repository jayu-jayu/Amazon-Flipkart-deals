name = "ai-ultra-deal-hunter"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
APP_ENV = "production"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ai-ultra-deal-hunter"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[observability]
enabled = true
